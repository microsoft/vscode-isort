# Run on a schedule
trigger: none
pr: none

schedules:
  - cron: '0 10 * * 1-5' # 10AM UTC (2AM PDT) MON-FRI (VS Code Pre-release builds at 9PM PDT)
    displayName: Nightly Pre-Release Schedule
    always: false # only run if there are source code changes
    branches:
      include:
        - main

resources:
  repositories:
    - repository: MicroBuildTemplate
      type: git
      name: 1ESPipelineTemplates/MicroBuildTemplate
      ref: refs/tags/release

    - repository: templates
      type: git
      name: DevDiv/Pylance-Eng
      # Test the localization templates before merging the Pylance-Eng PR.
      ref: refs/heads/users/bschnurr/localization-pipeline

    - repository: translations
      type: github
      name: microsoft/vscode-extensions-loc
      ref: refs/heads/main
      endpoint: GitHub-VSCodeExtensions
variables:
  - name: TeamName
    value: VSCode-isort
  - name: VsixName
    value: isort.vsix
  - name: NPM_CONFIG_REGISTRY
    value: 'https://packagefeedproxy.microsoft.io/npm/'
  - name: PIP_PROXY_INDEX_URL
    value: 'https://packagefeedproxy.microsoft.io/pypi/simple/'

parameters:
  - name: publishExtension
    displayName: 🚀 Publish Extension
    type: boolean
    default: false

  - name: l10nShouldOnlyPush
    displayName: 'Only submit English strings (skip translation import)'
    type: boolean
    default: false

  - name: buildSteps
    type: stepList
    default:
      - script: git submodule update --init --recursive
        displayName: Checkout submodules
      - script: npm run ci:msft
        displayName: Install NPM dependencies

      - script: python -m pip install -U pip
        displayName: Upgrade pip
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install wheel
        displayName: Install wheel
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install nox
        displayName: Install nox
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m nox --session install_bundled_libs
        displayName: Install Python dependencies
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python ./build/update_ext_version.py --for-publishing
        displayName: Update build number

      - script: npm run package
        displayName: Build extension

extends:
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    sdl:
      sourceAnalysisPool: VSEngSS-MicroBuild2022-1ES
      codeSignValidation:
        enabled: true
      sbom:
        enabled: false # Disable global SBOM generation; we'll enable selectively per artifact output
    pool:
      name: AzurePipelines-EO
      os: windows

    customBuildTags:
      - ES365AIMigrationTooling
    stages:
      - stage: Build
        displayName: Build & Package Extension
        jobs:
          - template: azure-pipelines/extension/templates/jobs/package.yml@templates
            parameters:
              buildSteps: ${{ parameters.buildSteps }}
              isPreRelease: true
              standardizedVersioning: true
              customNPMRegistry: $(NPM_CONFIG_REGISTRY)
              l10nShouldProcess: true
              l10nSourcePaths: ./src
              l10nShouldOnlyPush: ${{ parameters.l10nShouldOnlyPush }}

      - stage: Publish
        displayName: Publish Extension
        dependsOn: Build
        condition: and(succeeded(), ${{ eq(parameters.publishExtension, true) }})
        jobs:
          - template: azure-pipelines/extension/templates/jobs/publish-extension.yml@templates
            parameters:
              publishExtension: ${{ parameters.publishExtension }}
              preRelease: true
              teamName: $(TeamName)
              ghCreateTag: true
              ghCreateRelease: true
              ghReleaseAddChangeLog: true
              customNPMRegistry: $(NPM_CONFIG_REGISTRY)
