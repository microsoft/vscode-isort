trigger: none
#   branches:
#     include:
#       - release*
#   tags:
#     include: ['*']
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: main
      endpoint: Monaco

variables:
  - name: NodeVersion
    value: '20.18.3'
  - name: PythonVersion
    value: '3.10'
  - name: NPM_CONFIG_REGISTRY
    value: 'https://packagefeedproxy.microsoft.io/npm/'
  - name: PIP_PROXY_INDEX_URL
    value: 'https://packagefeedproxy.microsoft.io/pypi/simple/'

parameters:
  - name: publishExtension
    displayName: 🚀 Publish Extension
    type: boolean
    default: false

extends:
  template: azure-pipelines/extension/stable.yml@templates
  parameters:
    customNPMRegistry: $(NPM_CONFIG_REGISTRY)
    l10nSourcePaths: ./src
    publishExtension: ${{ parameters.publishExtension }}
    buildSteps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(NodeVersion)
        displayName: Select Node version

      - task: UsePythonVersion@0
        inputs:
          versionSpec: $(PythonVersion)
          addToPath: true
          architecture: 'x64'
        displayName: Select Python version

      - script: git submodule update --init --recursive
        displayName: Checkout submodules
      - script: npm run ci:msft
        displayName: Install NPM dependencies

      - script: python -m pip install -U pip
        displayName: Upgrade pip
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install wheel
        displayName: Install wheel
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install nox
        displayName: Install wheel
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m nox --session install_bundled_libs
        displayName: Install Python dependencies
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python ./build/update_ext_version.py --release --for-publishing
        displayName: Update build number

      - script: npm run package
        displayName: Build extension
    tsa:
      config:
        areaPath: 'Visual Studio Code Python Extensions'
        serviceTreeID: '6e6194bc-7baa-4486-86d0-9f5419626d46'
      enabled: true
