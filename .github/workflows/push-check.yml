name: Push Validation

on:
  push:
    branches:
      - 'main'
      - 'release'
      - 'release/*'
      - 'release-*'

env:
  NPM_CONFIG_REGISTRY: https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/
  NODE_VERSION: 24.17.0
  PYTHON_VERSION: '3.10'
  TEST_RESULTS_DIRECTORY: .
  # Force a path with spaces and unicode chars to test extension works in these scenarios
  special-working-directory: './testingDir'
  special-working-directory-relative: 'testingDir'

jobs:
  build-vsix:
    name: Create VSIX
    if: github.repository_owner == 'microsoft'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build VSIX
        uses: ./.github/actions/build-vsix
        with:
          node_version: ${{ env.NODE_VERSION}}
          python_version: ${{ env.PYTHON_VERSION }}

  lint:
    name: Lint
    if: github.repository_owner == 'microsoft'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Lint
        uses: ./.github/actions/lint
        with:
          node_version: ${{ env.NODE_VERSION }}
          python_version: ${{ env.PYTHON_VERSION }}

  tests:
    name: Tests
    if: github.repository_owner == 'microsoft'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.special-working-directory }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.special-working-directory-relative }}

      - name: Checkout submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Authenticate package feeds
        uses: ./testingDir/.github/actions/authenticate-feeds

      # The last version is the default python; nox selects env.PYTHON_VERSION for bundling.
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: |
            ${{ env.PYTHON_VERSION }}
            ${{ matrix.python }}

      - name: Install pip, wheel and nox
        run: python -m pip install -U pip wheel nox
        shell: bash

      # This will install libraries to a target directory.
      - name: Install bundled python libraries
        run: python -m nox --session install_bundled_libs
        shell: bash

      - name: Run tests
        run: python -m nox --session tests
        shell: bash

      - name: Validate README.md
        run: python -m nox --session validate_readme
        shell: bash
