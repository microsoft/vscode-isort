version: 2

registries:
  pylance-public-packages-npm:
    type: 'npm-registry'
    url: 'https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/'
    tenant-id: '72f988bf-86f1-41af-91ab-2d7cd011db47'
    client-id: '92c669e8-02ad-4ce6-ad73-f222fc7177e2'
    replaces-base: true
  pylance-public-packages-pypi:
    type: 'python-index'
    url: 'https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/pypi/simple/'
    tenant-id: '72f988bf-86f1-41af-91ab-2d7cd011db47'
    client-id: '92c669e8-02ad-4ce6-ad73-f222fc7177e2'
    replaces-base: true

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'

updates:
  # NPM, Python, and GitHub Actions dependencies are updated together.
  - package-ecosystem: 'npm'
    registries:
      - 'pylance-public-packages-npm'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 7
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'

  - package-ecosystem: 'pip'
    registries:
      - 'pylance-public-packages-pypi'
    labels:
      - 'dependencies'
      - 'debt'
    directories:
      - '/'
      - '/src/test/python_tests'
    # Multi-ecosystem groups only support positive patterns. Keep isort
    # unmatched so its updates remain standalone.
    patterns:
      - 'attrs'
      - 'cattrs'
      - 'colorama'
      - 'exceptiongroup'
      - 'iniconfig'
      - 'lsprotocol'
      - 'mypy-extensions'
      - 'packaging'
      - 'pluggy'
      - 'pygls'
      - 'pygments'
      - 'pyhamcrest'
      - 'pytest'
      - 'python-lsp-jsonrpc'
      - 'tomli'
      - 'typing-extensions'
      - 'ujson'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 7

  # The shared package submodule is updated weekly in a standalone PR.
  - package-ecosystem: 'gitsubmodule'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    allow:
      - dependency-name: 'external/vscode-common-python-lsp'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1

  - package-ecosystem: 'github-actions'
    labels:
      - 'dependencies'
      - 'debt'
      - 'no-changelog'
    directory: '/'
    patterns:
      - '*'
    multi-ecosystem-group: 'dependencies'
    cooldown:
      # Delay updates beyond the highest-risk window after a release.
      default-days: 7
